name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build, validate, sign, and package
        uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          node-version: 22
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          sign_root_urls: ${{ vars.GRAFANA_ROOT_URLS }}
          attestation: true
