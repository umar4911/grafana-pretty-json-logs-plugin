name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package, such as v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run typecheck
          npm test

      - name: Build and package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./src/plugin.json').info.version")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version v$version" >&2
            exit 1
          fi
          if [[ "$plugin_version" != "$version" ]]; then
            echo "Plugin version $plugin_version does not match package version $version" >&2
            exit 1
          fi

          npm run build

          archive="umar-prettypino-app-$version.zip"
          staging="$(mktemp -d)"
          cp -R dist "$staging/umar-prettypino-app"
          (cd "$staging" && zip -qr "$GITHUB_WORKSPACE/$archive" umar-prettypino-app)
          unzip -t "$archive"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

          gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber
